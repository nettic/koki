    <style>
        :root {
            --primary-color: #004d99; /* Blau passend zum inIT / TH OWL Kontext */
            --primary-hover: #003366;
            --secondary-color: #e0e0e0;
            --secondary-hover: #cccccc;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        p {
            margin-bottom: 30px;
            color: #666;
            line-height: 1.5;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a.button {
            display: inline-block;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            background-color: var(--primary-color);
        }
        a.button:hover {
            background-color: var(--primary-hover);
        }
        a.button.login {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }
        a.button.login:hover {
            background-color: var(--secondary-hover);
        }
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
        }
        .logo path, .logo circle {
            fill: var(--primary-color);
        }
    </style>
</head>
